{% extends 'base.html' %}
{% block title %}Verificar Cuenta{% endblock %}

{% block auth_content %}
<div class="min-h-screen w-full bg-slate-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md overflow-hidden">
        <div class="bg-gradient-to-r from-[#f09433] via-[#dc2743] to-[#bc1888] p-8 text-center">
            <i class="fas fa-envelope-open-text text-6xl text-white drop-shadow-lg mb-4"></i>
            <h2 class="text-2xl font-bold text-white">Verifica tu correo</h2>
            <p class="text-white/80 text-sm mt-1">Enviamos un código a <strong>{{ email }}</strong></p>
        </div>
        
        <form method="POST" class="p-8 space-y-6">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div>
                <label class="block text-center text-sm font-medium text-slate-700 mb-2">Ingresa el código de 6 dígitos</label>
                <input type="text" name="codigo" maxlength="6" required 
                       class="w-full px-4 py-3 border border-slate-300 rounded-xl text-center text-3xl tracking-[0.5em] font-mono focus:border-[#dc2743] focus:ring-4 focus:ring-[#dc2743]/10 outline-none"
                       placeholder="000000">
            </div>
            
            <button type="submit" class="w-full bg-gradient-to-r from-[#f09433] via-[#dc2743] to-[#bc1888] hover:opacity-90 text-white font-bold py-3.5 rounded-xl shadow-lg transition">
                Verificar Cuenta
            </button>
        </form>
        
        <div class="text-center mt-4">
            <p class="text-xs text-slate-500 mb-2">¿No recibiste el código o ya expiró?</p>
            <form method="POST" action="{{ url_for('auth.reenviar_codigo', email=email) }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button type="submit" class="text-sm font-semibold text-[#dc2743] hover:text-[#bc1888] transition">
                    <i class="fas fa-paper-plane mr-1"></i> Solicitar nuevo código
                </button>
            </form>
        </div>
        
        <div class="bg-slate-50 p-4 text-center border-t border-slate-200">
            <a href="{{ url_for('auth.login') }}" class="text-sm text-slate-500 hover:text-slate-800">Volver al inicio</a>
        </div>
    </div>
</div>
{% endblock %}
