<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Sistema de Gestión</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { -webkit-font-smoothing: antialiased; }
        body { font-family: 'Inter', sans-serif; }
        
        .bg-pattern {
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(123, 213, 245, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(120, 127, 246, 0.15) 0%, transparent 50%);
        }
        
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }
        
        .float-slow { animation: floatSlow 6s ease-in-out infinite; }
        .float-slower { animation: floatSlow 8s ease-in-out infinite reverse; }
        
        .input-field { transition: all 0.2s ease; }
        .input-field:focus {
            outline: none;
            border-color: #1CA7EC;
            box-shadow: 0 0 0 4px rgba(28, 167, 236, 0.12);
        }
        
        .btn-register {
            background: linear-gradient(135deg, #1CA7EC 0%, #787FF6 100%);
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
        }
        .btn-register::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #4ADEDE 0%, #1CA7EC 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .btn-register:hover::before { opacity: 1; }
        .btn-register:hover { transform: translateY(-2px); box-shadow: 0 12px 24px rgba(28, 167, 236, 0.3); }
        .btn-register span { position: relative; z-index: 1; }
        
        .card-register { animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-[#1F2F98] via-[#182580] to-[#121b60] min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
    
    <div class="absolute inset-0 bg-pattern pointer-events-none"></div>
    
    <div class="absolute top-20 left-20 w-72 h-72 bg-[#7BD5F5] rounded-full blur-3xl opacity-20 float-slow"></div>
    <div class="absolute bottom-20 right-20 w-96 h-96 bg-[#787FF6] rounded-full blur-3xl opacity-15 float-slower"></div>
    
    <div class="w-full max-w-md relative z-10 card-register">
        
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-20 h-20 bg-white/10 backdrop-blur-sm rounded-2xl mb-5 border border-white/20 shadow-lg shadow-black/10">
                <i class="fas fa-user-plus text-white text-3xl"></i>
            </div>
            <h1 class="text-3xl font-bold text-white tracking-tight mb-2">Crear Cuenta</h1>
            <p class="text-[#7BD5F5] text-sm">Comienza a gestionar tu negocio hoy mismo</p>
        </div>
        
        <div class="bg-white rounded-3xl shadow-2xl p-8">
            
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                <div class="mb-5 px-4 py-3 rounded-xl text-sm flex items-start gap-3 bg-red-50 text-red-800 border border-red-200">
                    <i class="fas fa-exclamation-circle mt-0.5"></i>
                    <span>{{ message }}</span>
                </div>
                {% endfor %}
            {% endwith %}
            
            <form method="POST" class="space-y-4">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Nombre completo</label>
                    <div class="relative">
                        <i class="fas fa-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="text" name="nombre" required 
                               class="input-field w-full pl-11 pr-4 py-3.5 bg-slate-50 border-2 border-slate-200 rounded-xl"
                               placeholder="Juan Pérez">
                    </div>
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Email</label>
                    <div class="relative">
                        <i class="fas fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="email" name="email" required 
                               class="input-field w-full pl-11 pr-4 py-3.5 bg-slate-50 border-2 border-slate-200 rounded-xl"
                               placeholder="tu@email.com">
                    </div>
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Teléfono (opcional)</label>
                    <div class="relative">
                        <i class="fas fa-phone absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="tel" name="telefono" 
                               class="input-field w-full pl-11 pr-4 py-3.5 bg-slate-50 border-2 border-slate-200 rounded-xl"
                               placeholder="04141234567">
                    </div>
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Contraseña</label>
                    <div class="relative">
                        <i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="password" name="password" required minlength="6"
                               class="input-field w-full pl-11 pr-4 py-3.5 bg-slate-50 border-2 border-slate-200 rounded-xl"
                               placeholder="Mínimo 6 caracteres">
                    </div>
                </div>
                
                <button type="submit" class="btn-register w-full text-white font-semibold py-3.5 rounded-xl mt-2">
                    <span><i class="fas fa-user-plus mr-2"></i> Crear mi cuenta</span>
                </button>
            </form>
            
            <div class="mt-6 text-center">
                <p class="text-sm text-slate-500">
                    ¿Ya tienes cuenta?
                    <a href="{{ url_for('auth.login') }}" 
                       class="text-[#1CA7EC] hover:text-[#787FF6] font-semibold transition-colors">
                        Inicia sesión
                    </a>
                </p>
            </div>
        </div>
    </div>
</body>
</html>
